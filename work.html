<script>
  (() => {
    const grid = document.getElementById('grid'), fl = document.getElementById('filters'), feat = document.getElementById('feature'), count = document.getElementById('count');
    const q = new URLSearchParams(location.search).get('filter'), start = CATS[q] ? q : 'all';
    fl.innerHTML = [['all', 'All work'], ...Object.entries(CATS)].map(([k, v]) => `<button type="button" data-f="${k}" aria-pressed="false">${v} <small>${k === 'all' ? PROJECTS.length : PROJECTS.filter(p => p.cat === k).length}</small></button>`).join('');
    const lead = { all: 'vydehi' };
    const apply = (f, announce) => {
      fl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
      const list = PROJECTS.filter(p => f === 'all' || p.cat === f);
      const first = list.find(p => p.id === lead[f]) || list[0];
      feat.innerHTML = workCard(first, { feature: true }); grid.innerHTML = list.filter(p => p !== first).map(p => workCard(p)).join('');
      grid.hidden = list.length < 2;
      if (announce) count.textContent = `${list.length} ${list.length === 1 ? 'project' : 'projects'} shown`;
    };
    fl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; apply(b.dataset.f, true); history.replaceState(null, '', b.dataset.f === 'all' ? location.pathname : `?filter=${b.dataset.f}`); });
    apply(start);
  })();
</script>
