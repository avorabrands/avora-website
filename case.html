<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project | Avora Brands</title>
<meta name="description" content="Avora Brands case study.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Avora Brands">
<meta property="og:title" content="Project | Avora Brands">
<meta property="og:description" content="Avora Brands case study.">
<meta property="og:url" content="https://www.avorabrands.in/case">
<meta property="og:image" content="https://www.avorabrands.in/images/share-avora.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1106">
<meta property="og:image:alt" content="Avora Brands logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.avorabrands.in/images/share-avora.jpg">
<meta name="theme-color" content="#061226">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png?v=3">
<link rel="apple-touch-icon" href="/images/favicon-512.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="work" class="dark-top">
<div data-header></div>
<main id="cs"></main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script>
  /* render before site.js so shared behaviours bind to the case study */
  (() => {
    const id = new URLSearchParams(location.search).get('p');
    const i = Math.max(0, PROJECTS.findIndex(p => p.id === id)), p = PROJECTS[i], next = PROJECTS[(i + 1) % PROJECTS.length];
    document.title = `${p.client}, ${CATS[p.cat]} Project | Avora Brands`;
    document.querySelector('meta[name=description]').content = p.summary;
    const g = /-thumb\./.test(p.cover) ? p.gallery : [p.cover, ...p.gallery];
    document.getElementById('cs').innerHTML = `
    <section class="page-hero work-hero3 cs-hero">
      <div class="sp-bg" style="background-image:url('${g[0] || p.cover}')" aria-hidden="true"></div>
      <div class="container on-dark sp-wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="work.html">Work</a><span>/</span><span>${p.client}</span></nav>
        <div class="sp-main">
          <div class="sp-copy">
            <span class="chip chip--gold reveal">${CATS[p.cat]}</span>
            <div class="sp-text in">
              <p class="cs-client">${p.client}</p>
              <h1 data-split>${p.title}</h1>
              <p>${p.summary}</p>
              ${p.live ? `<div class="btn-row"><a class="btn btn--gold" href="${p.live}" target="_blank" rel="noopener">Visit live site <i data-i="arrow"></i></a></div>` : ''}
            </div>
          </div>
          <a class="sp-frame" href="#gallery" data-lb="0" aria-label="View ${p.client} images"><img class="in" src="${g[0] || p.cover}" alt="${p.client}: ${p.title}"></a>
        </div>
      </div>
    </section>
    <section class="section--tight"><div class="container">
      <div class="cs-meta reveal"><div><small>Industry</small><b>${p.industry}</b></div><div><small>Services</small><b>${p.services}</b></div><div><small>Timeline</small><b>${p.timeline}</b></div><div><small>Year</small><b>${p.year}</b></div></div>
    </div></section>
    <section class="section" style="padding-top:20px"><div class="container cs-body">
      <nav class="cs-toc" aria-label="On this page"><a href="#overview" class="active">Overview</a><a href="#challenge">Challenge</a><a href="#solution">Solution</a><a href="#results">Highlights</a><a href="#deliverables">Deliverables</a>${g.length ? '<a href="#gallery">Gallery</a>' : ''}</nav>
      <div>
        <div class="cs-sec reveal" id="overview"><span class="eyebrow">Overview</span><h2 class="mt-8">The brief</h2><p>${p.overview}</p></div>
        <div class="cs-sec reveal" id="challenge"><span class="eyebrow">Challenge</span><h2 class="mt-8">What made it hard</h2><p>${p.challenge}</p></div>
        <div class="cs-sec reveal" id="solution"><span class="eyebrow">Solution</span><h2 class="mt-8">What we did</h2><p>${p.solution}</p></div>
        <div class="cs-sec reveal" id="results"><span class="eyebrow">Highlights</span><h2 class="mt-8">The outcome</h2><div class="result-list">${p.results.map(([k, v]) => `<div><small>${k}</small>${v}</div>`).join('')}</div></div>
        <div class="cs-sec reveal" id="deliverables"><span class="eyebrow">Deliverables</span><h2 class="mt-8">What we handed over</h2><div class="deliv">${p.deliverables.map(d => `<div>${d}</div>`).join('')}</div></div>
        ${g.length ? `<div class="cs-sec" id="gallery"><span class="eyebrow">Gallery</span><h2 class="mt-8">A closer look</h2>
          <div class="gallery">${g.map((s, k) => `<img class="reveal ${g.length % 2 && k === 0 ? 'wide' : ''}" src="${s}" alt="${p.client} design detail ${k + 1}" loading="lazy" data-lb="${k}" tabindex="0" role="button" aria-label="Open image ${k + 1} of ${g.length}">`).join('')}</div></div>` : ''}
      </div>
    </div></section>
    <section class="section" style="padding-top:0"><div class="container">
      <div class="grid g-2">
        <a class="next-proj reveal" href="case.html?p=${next.id}"><div><small>Next project</small><h3 class="h3 mt-8">${next.client}</h3><p style="color:#A9B1C7">${next.title}</p></div><span class="go"><i data-i="arrow"></i></span></a>
        <a class="next-proj reveal" style="background:linear-gradient(135deg,#0E86DC,#0B68AB);color:#fff" href="${wa('Hi Avora! I saw the ' + p.client + ' case study and want something similar.')}" target="_blank" rel="noopener"><div><small style="color:rgba(255,255,255,.85)">Like this?</small><h3 class="h3 mt-8">Start a similar project</h3><p style="color:rgba(255,255,255,.9)">Free 15-minute call</p></div><span class="go" style="background:var(--navy-950);color:#fff"><i data-i="arrow"></i></span></a>
      </div>
    </div></section>`;
    /* gallery lightbox */
    let cur = 0, box = null, wheelLock = 0, touchX = null;
    const show = (n) => { cur = (n + g.length) % g.length; box.querySelector('img').src = g[cur]; box.querySelector('img').alt = p.client + ' image ' + (cur + 1); box.querySelector('.lb-count').textContent = (cur + 1) + ' / ' + g.length; };
    const close = () => { if (!box) return; box.remove(); box = null; document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); };
    const open = (n) => {
      box = document.createElement('div'); box.className = 'lb'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Image viewer');
      box.innerHTML = '<button class="lb-x" aria-label="Close">&times;</button>' + (g.length > 1 ? '<button class="lb-nav lb-prev" aria-label="Previous image">&#8249;</button><button class="lb-nav lb-next" aria-label="Next image">&#8250;</button>' : '') + '<img alt=""><div class="lb-count"></div>';
      document.body.appendChild(box); document.body.style.overflow = 'hidden'; show(n);
      box.addEventListener('click', (e) => { if (e.target === box || e.target.classList.contains('lb-x')) close(); else if (e.target.classList.contains('lb-next')) show(cur + 1); else if (e.target.classList.contains('lb-prev')) show(cur - 1); });
      box.addEventListener('wheel', (e) => { e.preventDefault(); const t = Date.now(); if (t - wheelLock < 350 || Math.abs(e.deltaY) < 8) return; wheelLock = t; show(cur + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
      box.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
      box.addEventListener('touchend', (e) => { if (touchX === null) return; const d = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(d) > 40) show(cur + (d < 0 ? 1 : -1)); });
      document.addEventListener('keydown', onKey);
    };
    document.getElementById('cs').addEventListener('click', (e) => { const t = e.target.closest('[data-lb]'); if (!t) return; e.preventDefault(); open(+t.dataset.lb); });
    document.getElementById('cs').addEventListener('keydown', (e) => { const t = e.target.closest('img[data-lb]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(+t.dataset.lb); } });
  })();
</script>
<script src="assets/js/site.js"></script>
<script>
  const toc = [...document.querySelectorAll('.cs-toc a')];
  const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) toc.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.cs-sec').forEach(s => o.observe(s));
  /* hero stage: tilted on load, lies flat as you scroll into it */
  const st = document.querySelector('.cs-stage');
  if (st) { const f = () => st.classList.toggle('flat', scrollY > 40 || st.getBoundingClientRect().top < innerHeight * .55); f(); addEventListener('scroll', f, { passive: true }); setTimeout(() => st.classList.add('flat'), 1400); }
</script>
</body>
</html>
