<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:site_name" content="Avora Brands">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="Case Study | Avora Brands">
<meta property="og:description" content="A project by Avora Brands, Bengaluru.">
<meta property="og:url" content="https://www.avorabrands.in/case">
<meta property="og:image" content="https://www.avorabrands.in/images/vydehi-thumb.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Case Study | Avora Brands">
<meta name="twitter:description" content="A project by Avora Brands, Bengaluru.">
<meta name="twitter:image" content="https://www.avorabrands.in/images/vydehi-thumb.jpg">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png?v=3">
<link rel="apple-touch-icon" href="/images/favicon-512.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="work">
<a class="skip-link" href="#main">Skip to content</a>
<div data-header><noscript><div class="container nav"><a class="brand" href="index.html">Avora Brands</a><nav aria-label="Main"><a class="nav-item" href="design.html">Brand &amp; digital</a><a class="nav-item" href="print.html">Print &amp; merch</a><a class="nav-item" href="growth.html">Growth plans</a><a class="nav-item" href="work.html">Work</a><a class="nav-item" href="about.html">About</a><a class="nav-item" href="contact.html">Contact</a></nav></div></noscript></div>
<main id="main"></main>
<div data-footer></div>
<script src="assets/js/images.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
  (() => {
    const id = new URLSearchParams(location.search).get('p'), i = PROJECTS.findIndex(p => p.id === id), p = PROJECTS[i], root = document.getElementById('main');
    if (!p) {
      document.title = 'Project not found | Avora Brands';
      document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
      root.innerHTML = `<section class="section"><div class="container stack"><h1 class="h1">We couldn’t find that project</h1><p class="lead">The link may be old. All our case studies are on the work page.</p><a class="btn btn--primary" href="work.html">See all work</a></div></section>`;
      return;
    }
    const others = PROJECTS.filter(x => x !== p);
    const related = [...others.filter(x => x.client === p.client), ...others.filter(x => x.cat === p.cat && x.client !== p.client), ...others.filter(x => x.industry === p.industry), ...others].filter((x, k, a) => a.indexOf(x) === k).slice(0, 3);
    /* service that matches this project, for the related link and the enquiry */
    const SVC = { branding: ['Branding and identity', 'design.html#branding', 'Branding'], website: ['Website design', 'design.html#website', 'Website or app'], app: ['Mobile app UI/UX', 'design.html#app', 'Website or app'], graphic: ['Graphic and editorial', 'design.html#graphic', 'Branding'], social: ['Social media design', 'design.html#social', 'Social and marketing'] }[p.cat];
    const start = `contact.html?need=${encodeURIComponent(SVC[2])}&about=${encodeURIComponent('Something similar to the ' + p.client + ' project')}#start`;
    const g = [p.cover, ...p.gallery];
    const hero = p.cover, rest = p.gallery;
    const sec = (id, title, body, wide) => `<section class="cs-sec${wide ? ' cs-sec--wide' : ''}" id="${id}" aria-labelledby="${id}-t"><h2 class="h3" id="${id}-t">${title}</h2>${body}</section>`;
    const toc = [['context', 'Client and context'], ['challenge', 'Challenge'], ['approach', 'Approach'], ['deliverables', 'Deliverables'], ['outcome', 'Outcome'], ...(rest.length ? [['gallery', 'Gallery']] : [])];
    root.innerHTML = `
    <section class="cs-hero"><div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="work.html">Work</a><span aria-hidden="true">/</span><span aria-current="page">${p.client}</span></nav>
      <div class="cs-head"><div><p class="eyebrow">${p.client} · ${CATS[p.cat]}</p><h1 class="h1">${p.title}</h1></div>
        <div><p class="lead">${p.summary}</p>${p.live ? `<a class="go" href="${p.live}" target="_blank" rel="noopener">Visit the live site<span class="sr-only"> (opens in a new tab)</span> ${ICONS.arrow}</a>` : ''}</div></div>
      <button type="button" class="cs-hero-shot" data-lb="0" aria-label="Enlarge image 1 of ${g.length}">${pic(hero, { alt: `${p.client}: ${p.title}`, sizes: '(max-width: 1240px) 94vw, 1200px', eager: true })}</button>
      <dl class="cs-meta"><div><dt>Industry</dt><dd>${p.industry}</dd></div><div><dt>Services</dt><dd>${p.services}</dd></div><div><dt>Timeline</dt><dd>${p.timeline}</dd></div><div><dt>Year</dt><dd>${p.year}</dd></div></dl>
    </div></section>
    <div class="section"><div class="container cs-body">
      <nav class="cs-toc" aria-label="On this page">${toc.map(([k, v]) => `<a href="#${k}">${v}</a>`).join('')}</nav>
      <div>
        ${sec('context', 'Client and context', `<p>${p.overview}</p>`)}
        ${sec('challenge', 'The challenge', `<p>${p.challenge}</p>`)}
        ${sec('approach', 'Our approach', `<p>${p.solution}</p>`)}
        ${sec('deliverables', 'What we delivered', `<ul class="ticks ticks--2">${p.deliverables.map(d => `<li>${d}</li>`).join('')}</ul>`)}
        ${sec('outcome', 'Outcome', `<dl class="results">${p.results.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`)}
        ${p.quote ? `<figure class="cs-sec quote-card"><blockquote class="pull">“${p.quote.text}”</blockquote><figcaption><b>${p.quote.name}</b><span>${p.quote.role || p.client}</span></figcaption></figure>` : ''}
        ${rest.length ? sec('gallery', 'Gallery', `<div class="gallery">${rest.map((s, k) => `<button type="button" data-lb="${k + 1}" aria-label="Enlarge image ${k + 2} of ${g.length}">${pic(s, { alt: `${p.client} project, image ${k + 2}`, sizes: '(max-width: 560px) 94vw, 480px' })}</button>`).join('')}</div>`, true) : ''}
        <p class="mt-48"><span class="muted">Related service: </span><a class="link" href="${SVC[1]}">${SVC[0]}</a></p>
      </div>
    </div></div>
    <section class="section section--tint" aria-labelledby="relTitle"><div class="container"><div class="section-head section-head--row"><div><h2 class="h2" id="relTitle">Related projects</h2></div><a class="go" href="work.html">All projects ${ICONS.arrow}</a></div>
      <div class="grid grid--3">${related.map(x => workCard(x)).join('')}</div></div></section>
    <section class="section" aria-labelledby="ctaTitle"><div class="container"><div class="cta-band">
      <div><h2 class="h1" id="ctaTitle">Want something <span class="serif">like this?</span></h2><p class="lead">We’ll reply within one working day.</p></div>
      <div class="ask"><a class="btn btn--primary" href="${start}">Start a project ${ICONS.arrow}</a><a class="wa-link" href="${wa('Hi Avora! I saw the ' + p.client + ' case study and want something similar.')}" target="_blank" rel="noopener">${ICONS.wa} WhatsApp us for a quick reply</a></div>
    </div></div></section>`;

    setMeta({
      title: `${p.client}: ${CATS[p.cat]} Case Study | Avora Brands`, description: p.summary, path: `case?p=${p.id}`, image: hero,
      jsonLd: { '@type': 'CreativeWork', name: `${p.client}: ${p.title}`, description: p.summary, image: `${SITE.url}/${decodeURI(hero)}`, url: `${SITE.url}/case?p=${p.id}`, creator: { '@type': 'Organization', name: 'Avora Brands', url: SITE.url } }
    });
    root.addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) openLightbox(g, +b.dataset.lb, p.client); });
    const links = [...root.querySelectorAll('.cs-toc a')];
    const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.hash === '#' + e.target.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current')); }), { rootMargin: '-25% 0px -65% 0px' });
    root.querySelectorAll('.cs-sec[id]').forEach(s => spy.observe(s));
  })();
</script>
</body>
</html>
