<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="blog">
<a class="skip-link" href="#main">Skip to content</a>
<div data-header><noscript><div class="container nav"><a class="brand" href="index.html">Avora Brands</a><nav aria-label="Main"><a class="nav-item" href="design.html">Brand &amp; digital</a><a class="nav-item" href="print.html">Print &amp; merch</a><a class="nav-item" href="growth.html">Growth plans</a><a class="nav-item" href="work.html">Work</a><a class="nav-item" href="about.html">About</a><a class="nav-item" href="contact.html">Contact</a></nav></div></noscript></div>
<div class="progress" aria-hidden="true"></div>
<main id="main"></main>
<div data-footer></div>
<script src="assets/js/images.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/posts-content.js"></script>
<script src="assets/js/site.js"></script>
<script>
  (() => {
    const id = new URLSearchParams(location.search).get('p'), p = POSTS.find(x => x.id === id), root = document.getElementById('main');
    if (!p) {
      document.title = 'Article not found | Avora Brands';
      document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
      root.innerHTML = `<section class="section"><div class="container stack"><h1 class="h1">We couldn’t find that article</h1><p class="lead">It may have moved. All our guides are on the Insights page.</p><a class="btn btn--primary" href="blog.html">See all guides</a></div></section>`;
      return;
    }
    const body = POST_BODIES[p.id], person = PEOPLE.find(x => x.name === p.author), cta = POST_CTAS[p.cat];
    const fmt = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    const shared = x => x.topics.filter(t => p.topics.includes(t)).length;
    const related = POSTS.filter(x => x !== p).sort((a, b) => shared(b) - shared(a)).slice(0, 3);
    const url = `${SITE.url}/post?p=${p.id}`;
    const clean = t => t.replace(/<[^>]+>/g, '').replace(/^\d+\.\s*/, '');
    const heads = [...body.html.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)].map(m => [m[1], clean(m[2])]);
    root.innerHTML = `
    <section class="page-head"><div class="container"><div class="page-head-in">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="blog.html">Insights</a><span aria-hidden="true">/</span><span aria-current="page">${p.cat}</span></nav>
      <h1 class="h1">${p.title}</h1><p class="lead">${p.excerpt}</p>
      <span class="byline">${pic(person.img, { alt: '', sizes: '44px', eager: true })}<span><b>${p.author}</b>${p.role} · <time datetime="${p.date}">${fmt(p.date)}</time> · ${p.read}</span></span>
    </div></div></section>
    <div class="container mt-32"><div class="post-banner">${body.banner ? pic(body.banner, { alt: '', sizes: '(max-width: 1240px) 94vw, 1200px', eager: true }) : ''}</div></div>
    <div class="section" style="padding-top:clamp(2rem,1.5rem + 2vw,4rem)"><div class="container post-layout">
      <article>
        <div class="prose">${body.html}</div>
        <div class="author-box">${pic(person.img, { alt: `Portrait of ${p.author}`, sizes: '88px' })}<div><p><b>${p.author}</b>, ${p.role}</p><p class="small muted">${AUTHOR_NOTES[p.author] || person.about}</p></div></div>
        <div class="share"><span class="muted">Share</span><a class="btn btn--secondary btn--sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p.title + ' ' + url)}">WhatsApp<span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn--secondary btn--sm" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}">LinkedIn<span class="sr-only"> (opens in a new tab)</span></a><button class="btn btn--secondary btn--sm" type="button" id="copy">Copy link</button></div>
      </article>
      ${heads.length > 2 ? `<aside class="post-aside"><nav class="post-toc" aria-labelledby="tocT"><h2 id="tocT">In this guide</h2>${heads.map(([h, t]) => `<a href="#${h}">${t}</a>`).join('')}</nav></aside>` : ''}
    </div></div>
    <section class="section section--tint" aria-labelledby="relT"><div class="container"><div class="section-head section-head--row"><div><h2 class="h2" id="relT">Related reading</h2></div><a class="go" href="blog.html">All guides ${ICONS.arrow}</a></div>
      <div class="grid grid--3">${related.map(m => `<a class="post-card" href="post.html?p=${m.id}"><div class="shot">${pic(m.img, { alt: '', sizes: '(max-width: 860px) 94vw, 380px' })}</div><div class="txt"><span class="meta">${m.cat} · ${m.read}</span><h3>${m.title}</h3><p>${m.author}</p></div></a>`).join('')}</div></div></section>
    <section class="section" aria-labelledby="ctaTitle"><div class="container"><div class="cta-band"><div><h2 class="h1" id="ctaTitle">${cta.title}</h2><p class="lead">${cta.text}</p></div>
      <div class="ask"><a class="btn btn--primary" href="${cta.href}">${cta.label} ${ICONS.arrow}</a><a class="wa-link" href="${wa('Hi Avora! I read "' + p.title + '" and have a question.')}" target="_blank" rel="noopener">${ICONS.wa} WhatsApp us for a quick reply</a></div></div></div></section>`;

    setMeta({
      title: `${p.title} | Avora Brands`, description: p.excerpt, path: `post?p=${p.id}`, image: p.img,
      jsonLd: { '@type': 'BlogPosting', headline: p.title, description: p.excerpt, datePublished: p.date, image: `${SITE.url}/${p.img}`, author: { '@type': 'Person', name: p.author, jobTitle: p.role }, publisher: { '@type': 'Organization', name: 'Avora Brands', url: SITE.url }, mainEntityOfPage: url }
    });
    const bar = document.querySelector('.progress');
    addEventListener('scroll', () => { const h = document.documentElement; bar.style.transform = `scaleX(${h.scrollTop / Math.max(1, h.scrollHeight - innerHeight)})`; }, { passive: true });
    document.getElementById('copy').addEventListener('click', e => navigator.clipboard?.writeText(url).then(() => { e.target.textContent = 'Link copied'; }));
  })();
</script>
</body>
</html>
