<script>
  (() => {
    const fmt = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    const face = n => (PEOPLE.find(x => x.name === n) || {}).img;
    const by = p => `<span class="byline">${pic(face(p.author), { alt: '', sizes: '44px' })}<span><b>${p.author}</b>${p.role} · ${fmt(p.date)}</span></span>`;
    const card = (p, big) => `<a class="post-card${big ? ' post-card--feature' : ''}" href="post.html?p=${p.id}"><div class="shot">${pic(p.img, { alt: '', sizes: big ? '(max-width: 860px) 94vw, 680px' : '(max-width: 600px) 94vw, 590px', eager: big })}</div>
      <div class="txt"><span class="meta">${p.cat} · ${p.read}</span>${big ? `<h2>${p.title}</h2>` : `<h3>${p.title}</h3>`}${big ? `<p>${p.excerpt}</p>` : ''}${by(p)}</div></a>`;
    const feat = document.getElementById('feature'), grid = document.getElementById('posts'), topics = document.getElementById('topics'), count = document.getElementById('count');
    const cats = [...new Set(POSTS.map(p => p.cat))];
    topics.innerHTML = ['All', ...cats].map(c => `<button type="button" data-c="${c}" aria-pressed="false">${c} <small>${c === 'All' ? POSTS.length : POSTS.filter(p => p.cat === c).length}</small></button>`).join('');
    const apply = (c, say) => {
      const [first, ...rest] = POSTS.filter(p => c === 'All' || p.cat === c);
      topics.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === c));
      feat.innerHTML = card(first, true); grid.innerHTML = rest.map(p => card(p)).join(''); grid.hidden = !rest.length;
      if (say) count.textContent = `${rest.length + 1} ${rest.length ? 'guides' : 'guide'} shown`;
    };
    topics.addEventListener('click', e => { const b = e.target.closest('button'); if (b) apply(b.dataset.c, true); });
    apply('All');
  })();
</script>
